$kind: http-request
name: GET /api/loans/1 (Retrieve by ID)
url: "{{baseUrl}}/api/loans/1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Loan has id 1", function () {
        pm.expect(pm.response.json()).to.have.property("id", 1);
      });
    language: text/javascript
order: 2000
